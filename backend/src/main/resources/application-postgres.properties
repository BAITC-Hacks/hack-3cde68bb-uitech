spring.datasource.url=${UITECH_DB_URL:jdbc:postgresql://127.0.0.1:5433/uitech?reWriteBatchedInserts=true}
spring.datasource.username=${UITECH_DB_USER:uitech}
spring.datasource.password=${UITECH_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.flyway.clean-disabled=true
uitech.migrate-local=${UITECH_MIGRATE_LOCAL:false}
uitech.files-dir=${UITECH_FILES_DIR:../.local/files}
